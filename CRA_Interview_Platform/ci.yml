name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            server/admin-web/package-lock.json
      - run: npm ci
      - run: npm run check:release
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm --prefix server audit --omit=dev --audit-level=moderate
      - run: npm --prefix server/admin-web audit --omit=dev --audit-level=moderate
